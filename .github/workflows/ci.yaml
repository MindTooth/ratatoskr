name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module dependencies
        run: |
          go mod download
          go mod verify

      - name: Test production build configuration
        run: |
          coverage_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$coverage_dir"
          go test -mod=readonly -count=1 -race -tags=containers_image_openpgp \
            -covermode=atomic -coverpkg=./... -coverprofile="$coverage_dir/coverage.out" ./...

      - name: Report Go coverage
        run: |
          coverage_dir="$RUNNER_TEMP/coverage"
          go tool cover -func="$coverage_dir/coverage.out" > "$coverage_dir/coverage.txt"
          go tool cover -html="$coverage_dir/coverage.out" -o "$coverage_dir/coverage.html"
          {
            echo '## Go coverage'
            echo
            grep '^total:' "$coverage_dir/coverage.txt"
            echo
            printf -- '- Tested SHA: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Toolchain: `%s`\n' "$(go version)"
            printf -- '- Platform: `%s/%s`\n' "$(go env GOOS)" "$(go env GOARCH)"
            echo '- Build tag: `containers_image_openpgp`'
            echo '- Scope: all module packages (`./...`), including the CLI; atomic cross-package coverage with race detection.'
            echo
            echo '<details><summary>Function coverage</summary>'
            echo
            echo '```text'
            cat "$coverage_dir/coverage.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coverage/coverage.out
            ${{ runner.temp }}/coverage/coverage.txt
            ${{ runner.temp }}/coverage/coverage.html
          if-no-files-found: error
          retention-days: 14

      - name: Build production binary
        run: CGO_ENABLED=0 go build -tags=containers_image_openpgp -trimpath -o /tmp/ratatoskr ./cmd/ratatoskr

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=containers_image_openpgp


  helm:
    name: Helm lint and API validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Lint the chart with required deployment values
        run: |
          helm lint --strict charts/ratatoskr --values .github/fixtures/helm/valid-values.yaml
          helm lint --strict charts/ratatoskr --values .github/fixtures/helm/explicit-source-values.yaml

      - name: Enforce chart version bumps for chart changes
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "$TARGET_BRANCH"

      - name: Render Kubernetes variants
        run: |
          helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/valid-values.yaml \
            > /tmp/chart-standard.yaml
          helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/valid-values.yaml \
            --set persistence.enabled=true \
            --set pdb.enabled=false \
            --set replicaCount=1 \
            > /tmp/chart-persistence.yaml
          helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/explicit-source-values.yaml \
            > /tmp/chart-explicit-source.yaml

      - name: Ensure PodDisruptionBudget requires high availability
        run: |
          if helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/valid-values.yaml \
            --set replicaCount=1 >/dev/null 2>&1; then
            echo 'pdb.enabled must require replicaCount >= 2' >&2
            exit 1
          fi

      - name: Reject shared HA cache and unsafe disruption budgets
        run: |
          for invalid in persistence.enabled=true pdb.maxUnavailable=2 pdb.maxUnavailable=51%; do
            if helm template ratatoskr charts/ratatoskr \
              --values .github/fixtures/helm/valid-values.yaml \
              --set "$invalid" >/dev/null 2>&1; then
              echo "unsafe HA configuration accepted: $invalid" >&2
              exit 1
            fi
          done

      - name: Render OpenShift route variant
        run: |
          helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/valid-values.yaml \
            --values charts/ratatoskr/values-openshift.yaml \
            --set route.enabled=true \
            --api-versions route.openshift.io/v1/Route \
            > /tmp/chart-openshift.yaml

      - name: Ensure Route fails without the OpenShift API
        run: |
          if helm template ratatoskr charts/ratatoskr \
            --values .github/fixtures/helm/valid-values.yaml \
            --set route.enabled=true >/dev/null 2>&1; then
            echo 'route.enabled must require the OpenShift Route API' >&2
            exit 1
          fi

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Validate rendered resources against the Kubernetes API
        run: |
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-standard.yaml
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-persistence.yaml
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-explicit-source.yaml

  container-verify:
    name: Container build
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1.18.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      file: Containerfile
      output: image
      push: false
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs:
      - go
      - lint
      - helm
      - container-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/release.yaml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    secrets: inherit
