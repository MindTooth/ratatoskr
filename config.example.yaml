---
listenAddress: ":8080"
# Set true to include query strings and user agents in request logs.
# debug: true
refreshInterval: 6h
refreshTimeout: 30m
# Maximum age of retained datasource results, including during upstream outages.
maxSnapshotAge: 24h
parseConcurrency: 2
# OpenShift cluster-release lookups use the official update graph. Override the
# URL only for testing or an explicitly trusted mirror.
# openshiftGraphURL: https://api.openshift.com/api/upgrades_info/v1/graph
# openshiftTimeout: 30s
# Refresh control endpoints are disabled unless this file is set. Mount it from
# a Secret; callers send its value as an Authorization: Bearer token.
# refreshTokenFile: /var/run/olm-refresh-token/token
# Mount an explicit containers/image policy in production.
# Changing this path on reload refreshes catalogs after any active read finishes.
# signaturePolicy: /etc/containers/policy.json
# linux/amd64 is the default for every generated and explicit source.
# platform: linux/amd64

# A channel creates redhat, certified, and community sources. Versions without
# a v prefix must be quoted so YAML keeps them as strings.
channels:
  - "4.22"

# Optionally select a subset of the built-in catalogs.
# catalogs:
#   - redhat
#   - community

# Exact source definitions remain available for custom catalogs and overrides.
# A source whose ID matches a generated source replaces that complete source.
# sources:
#   - id: community-v4.22
#     image: mirror.example.com/community-operator-index:v4.22
#     platform: linux/arm64
#   - id: private-v4.22
#     image: registry.example.com/private-operator-index:v4.22
